<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Anda sedang offline | Al-Hikmah AI</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgb(15 23 42 / 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 8px; color: #475569; font-size: 14px; line-height: 1.6; }
      a.button {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 14px;
        background: #059669;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #070b14; color: #e2e8f0; }
        main { background: #0f172a; border-color: #1e293b; box-shadow: none; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Offline</span>
      <h1>Anda sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat Anda.</p>
      <p>Al-Qur'an tetap bisa dibaca lengkap 114 surah tanpa internet dari halaman Qur'an yang sudah pernah dibuka.</p>
      <a class="button" href="/quran">Buka Al-Qur'an offline</a>
    </main>
  </body>
</html>
