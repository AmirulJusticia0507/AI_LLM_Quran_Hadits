services:
  - type: web
    name: alhikmah-ai-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: griphub
      - key: GRIPHUB_BASE_URL
        value: https://griphubrouter.web.id/v1
      - key: GRIPHUB_API_KEY
        sync: false
      - key: GRIPHUB_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
    healthCheckPath: /api/health
